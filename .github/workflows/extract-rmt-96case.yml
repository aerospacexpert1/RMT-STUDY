name: Extract RMT 96-case package

on:
  push:
    branches: [rmt-improved-96case]
    paths:
      - '.github/workflows/extract-rmt-96case.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rmt-improved-96case
          fetch-depth: 0

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract production RMT package
        run: |
          rm -rf RMT_TRUBA_96CASE_EXTRACTED
          mkdir -p RMT_TRUBA_96CASE_EXTRACTED
          7z x -y RMT_TRUBA_96CASE.rar -oRMT_TRUBA_96CASE_EXTRACTED
          find RMT_TRUBA_96CASE_EXTRACTED -maxdepth 3 -type f -print

      - name: Commit extracted sources
        run: |
          git config user.name "chatgpt-rmt-prep"
          git config user.email "actions@users.noreply.github.com"
          git add RMT_TRUBA_96CASE_EXTRACTED
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract RMT 96-case production package for improved solver work"
            git push origin HEAD:rmt-improved-96case
          fi
